# Application Name
spring.application.name=employeemanagementsystem

# Database Configuration - All sensitive values from environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# SECURITY: Disable SQL logging in production (set via env var)
spring.jpa.show-sql=${SHOW_SQL:false}

# Server Configuration
server.port=${SERVER_PORT:8080}

# SECURITY: Hide server version and error details
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

